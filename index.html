<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART Scanner</title>
</head>
<body>

  <h1>SMART Scanner</h1>
  <p>SMART POS Mobile Barcode Scanner</p>

  <button id="btnBukaKamera">
    📷 Buka Kamera
  </button>

  <br><br>

  <video
    id="previewKamera"
    autoplay
    playsinline
    style="width:100%;max-width:500px;display:none;">
  </video>

  <p id="statusKamera"></p>

  <h2>Hasil Barcode</h2>
  <p id="hasilBarcode">Belum ada barcode terbaca.</p>

  <script>
    const btnBukaKamera = document.getElementById('btnBukaKamera');
    const previewKamera = document.getElementById('previewKamera');
    const statusKamera = document.getElementById('statusKamera');
    const hasilBarcode = document.getElementById('hasilBarcode');

    let barcodeDetector = null;
    let prosesScanAktif = false;

    let menungguBarcodePergi = false;
let waktuMulaiKosong = 0;

const params =
  new URLSearchParams(
    window.location.search
  );

const channelScanner =
  String(
    params.get('channel') || ''
  ).trim();

const urlBackend =
  'https://script.google.com/macros/s/AKfycbw1xMC_sswRgcTvLdMzHL89TfJNjA0Z8oGQbIjiFyN5VUN72OP7M7KEyk9QQJfMgUWC/exec';

    btnBukaKamera.addEventListener('click', async function () {
      try {
        statusKamera.textContent = 'Membuka kamera...';

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' }
          },
          audio: false
        });

        previewKamera.srcObject = stream;
        previewKamera.style.display = 'block';

        await previewKamera.play();

        statusKamera.textContent = '✅ Kamera berhasil dibuka.';

        if (!('BarcodeDetector' in window)) {
          hasilBarcode.textContent =
            '❌ BarcodeDetector tidak didukung browser ini.';
          return;
        }

        barcodeDetector = new BarcodeDetector({
          formats: [
            'ean_13',
            'ean_8',
            'code_128',
            'code_39',
            'upc_a',
            'upc_e'
          ]
        });

        prosesScanAktif = true;
        scanBarcode();

      } catch (err) {
        statusKamera.textContent =
          '❌ Kamera gagal dibuka: ' + err.name + ' - ' + err.message;
      }
    });

async function scanBarcode() {

  if(
    !prosesScanAktif ||
    !barcodeDetector
  ){
    return;
  }

  try {

    const barcodes =
      await barcodeDetector.detect(
        previewKamera
      );


    // ======================================================
    // BARCODE SUDAH DIKIRIM
    // Tunggu barcode keluar dari kamera dulu
    // ======================================================

if(menungguBarcodePergi){

  if(barcodes.length > 0){

    // Barcode masih terlihat.
    // Reset waktu kosong.
    waktuMulaiKosong = 0;

  }else{

    // Kamera mulai tidak melihat barcode
    if(!waktuMulaiKosong){

      waktuMulaiKosong =
        Date.now();

    }


    // Barcode harus hilang terus selama 1,2 detik
    if(
      Date.now() -
      waktuMulaiKosong >=
      1200
    ){

      menungguBarcodePergi =
        false;

      waktuMulaiKosong =
        0;

      hasilBarcode.textContent =
        '✅ Siap scan berikutnya...';

    }

  }


  requestAnimationFrame(
    scanBarcode
  );

  return;

}


    // ======================================================
    // BARCODE BARU TERDETEKSI
    // ======================================================

    if(barcodes.length > 0){

      const nilaiBarcode =
        String(
          barcodes[0].rawValue || ''
        ).trim();


      if(nilaiBarcode){

        hasilBarcode.textContent =
          '✅ ' + nilaiBarcode;


        if(!channelScanner){

          hasilBarcode.textContent =
            '❌ Channel scanner tidak ditemukan.';

          prosesScanAktif = false;

          return;

        }


        // ==================================================
        // KIRIM KE APPS SCRIPT TANPA PINDAH HALAMAN
        // Hidden iframe menghindari masalah CORS
        // ==================================================

        const urlKirim =
          urlBackend +
          '?action=scannerPush' +
          '&channel=' +
          encodeURIComponent(
            channelScanner
          ) +
          '&barcode=' +
          encodeURIComponent(
            nilaiBarcode
          ) +
          '&t=' +
          Date.now();


        let iframe =
          document.getElementById(
            'smartScannerKirimFrame'
          );


        if(!iframe){

          iframe =
            document.createElement(
              'iframe'
            );

          iframe.id =
            'smartScannerKirimFrame';

          iframe.style.display =
            'none';

          document.body.appendChild(
            iframe
          );

        }


        iframe.src =
          urlKirim;


        console.log(
          'SMART BARCODE DIKIRIM:',
          nilaiBarcode,
          channelScanner
        );


        // Kamera TETAP hidup.
        // Barcode yang sama tidak dikirim berulang
        // sampai barcode keluar dari frame.
menungguBarcodePergi = true;
waktuMulaiKosong = 0;

      }

    }

  } catch (err) {

    console.log(
      'Scan barcode:',
      err
    );

  }


  requestAnimationFrame(
    scanBarcode
  );

}
  </script>

</body>
</html>
